<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlasdle — Banderas y capitales del mundo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12;
  --surface:#151822;
  --surface-alt:#1c202b;
  --surface-raised:#1f2430;
  --text-dim:#8991a3;
  --text-dimmer:#6b7386;
  --text-body:#aab2c4;
  --title-teal:#5eead4;
  --title-teal-deep:#2dd4bf;
  --title-gold:#f8c95c;
  --title-gold-deep:#e0a72e;
  --accent-pink:#ff7597;
  --accent-pink-deep:#ff4d73;
  --select-blue:#4da3ff;
  --select-blue-deep:#2f7fe0;
  --line: rgba(255,255,255,0.09);
  --line-strong: rgba(255,255,255,0.16);
  --radius-card: 14px;
  --radius-chip: 999px;
  --shadow-card: 0 14px 34px rgba(0,0,0,0.5);
  --font-display: "Fraunces", serif;
  --font-body: "Work Sans", sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text-body);
  line-height:1.5;
}
button{font-family:inherit;}
input{font-family:inherit;}

/* ---------- Ghost-flags background ---------- */
.flag-bg{
  position:fixed; inset:-40px;
  z-index:0;
  overflow:hidden;
  display:grid;
  gap:6px;
  padding:6px;
  filter:saturate(1.05) blur(3px);
  opacity:0.55;
  transition:opacity .4s ease, filter .4s ease;
}
.flag-bg img{
  width:100%; height:100%;
  object-fit:cover;
  border-radius:5px;
  display:block;
  transform-origin:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.35);
}
.flag-bg-scrim{
  position:fixed; inset:0;
  z-index:1;
  background:radial-gradient(120% 120% at 50% 30%, rgba(11,13,18,0.45) 0%, rgba(11,13,18,0.72) 70%, rgba(11,13,18,0.85) 100%);
  pointer-events:none;
  transition:background .3s ease;
}
.app{position:relative; z-index:2; max-width:640px; margin:0 auto; padding:0 0 64px;}

/* ---------- Screen transition ---------- */
.screen-enter{animation:screenIn .38s cubic-bezier(.2,.7,.3,1) both;}
@keyframes screenIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* ---------- Hero ---------- */
.hero{
  background:radial-gradient(120% 140% at 100% 0%, #1a2030 0%, #0d0f16 55%, #0a0b10 100%);
  padding:36px 22px 46px;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--line-strong);
}
.hero-compass{
  position:absolute;
  right:-38px; top:-38px;
  width:150px; height:150px;
  opacity:0.14;
}
.hero-eyebrow{
  font-size:13px;
  letter-spacing:0.02em;
  color:var(--title-gold);
  margin:0 0 6px;
  font-weight:600;
}
.hero h1{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(2.2rem, 9vw, 3rem);
  margin:0 0 10px;
  letter-spacing:-0.01em;
  line-height:1.02;
  background:linear-gradient(100deg, var(--title-teal) 10%, var(--title-gold) 60%, var(--accent-pink) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{
  margin:0;
  max-width:46ch;
  color:var(--text-dim);
  font-size:15.5px;
}

/* ---------- Language toggle ---------- */
.lang-toggle{
  position:absolute; top:16px; right:16px; z-index:3;
  display:flex; gap:4px;
  background:rgba(0,0,0,0.35);
  border:1px solid var(--line-strong);
  border-radius:999px;
  padding:3px;
  backdrop-filter:blur(6px);
}
.lang-btn{
  border:none; background:transparent; color:var(--text-dim);
  border-radius:999px; padding:6px 12px;
  font-size:12px; font-weight:700; letter-spacing:0.04em;
  cursor:pointer; transition:background .15s ease, color .15s ease;
}
.lang-btn.active{background:var(--title-teal); color:#06231f;}
body.hard-mode .lang-btn.active{background:var(--accent-pink); color:#2a0410;}

/* ---------- Section shell ---------- */
.section{padding:22px 22px 0;}
.section h2{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.32rem;
  margin:0 0 4px;
  color:var(--title-teal);
}
.section .hint{margin:0 0 14px; font-size:13.5px; color:var(--text-dim);}

/* ---------- Daily challenge stamp ---------- */
.stamp-card{
  background:var(--surface);
  border:2px dashed var(--title-gold-deep);
  border-radius:16px;
  padding:18px 18px 16px;
  position:relative;
  transform:rotate(-0.6deg);
  box-shadow:var(--shadow-card);
  animation:stampSettle .5s cubic-bezier(.2,.8,.3,1.2) both;
}
@keyframes stampSettle{
  from{opacity:0; transform:rotate(-6deg) scale(0.92);}
  to{opacity:1; transform:rotate(-0.6deg) scale(1);}
}
.stamp-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
.stamp-badge{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(248,201,92,0.14); color:var(--title-gold);
  font-size:12px; font-weight:600;
  padding:5px 10px; border-radius:999px;
  letter-spacing:0.02em;
}
.stamp-flag{font-size:2.4rem; line-height:1;}
.stamp-flag img{
  width:auto; height:36px; max-width:64px;
  object-fit:contain;
  border-radius:5px; box-shadow:0 3px 8px rgba(0,0,0,0.4);
  vertical-align:middle; background:rgba(0,0,0,0.25);
}
.stamp-title{font-family:var(--font-display); font-weight:700; font-size:1.15rem; margin:0; color:var(--title-gold);}
.stamp-sub{font-size:13px; color:var(--text-dim); margin:2px 0 0;}
.streak-pill{
  font-size:12.5px; font-weight:600; color:var(--title-teal);
  background:rgba(94,234,212,0.12);
  padding:4px 9px; border-radius:999px; white-space:nowrap;
}
.stamp-body{display:flex; align-items:center; gap:14px; margin-top:8px;}
.btn-daily{margin-top:12px; width:100%;}

/* ---------- Mode cards ---------- */
.mode-grid{display:flex; flex-direction:column; gap:10px;}
.mode-card{
  display:flex; align-items:center; gap:12px;
  background:var(--surface-alt); border:1px solid var(--line);
  border-radius:var(--radius-card);
  padding:13px 14px;
  cursor:pointer; text-align:left; width:100%;
  color:var(--text-body);
  transition:border-color .15s ease, background .15s ease, transform .15s ease;
}
.mode-card:hover{border-color:var(--title-teal-deep); transform:translateY(-1px);}
.mode-card.active{
  border-color:var(--title-teal-deep);
  background:rgba(94,234,212,0.09);
  box-shadow:0 0 0 1px var(--title-teal-deep) inset;
}
.mode-icon{font-size:1.6rem; width:34px; text-align:center; flex-shrink:0;}
.mode-text strong{display:block; font-size:15px; color:#e4e7ee;}
.mode-text span{display:block; font-size:12.5px; color:var(--text-dim); margin-top:1px;}

/* ---------- Chip rows ---------- */
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1px solid var(--line);
  background:var(--surface-alt);
  border-radius:var(--radius-chip);
  padding:8px 14px;
  font-size:13.5px; font-weight:500;
  cursor:pointer; color:var(--text-body);
  transition:transform .12s ease, background .12s ease;
}
.chip:hover{transform:translateY(-1px);}
.chip.active{
  background:var(--title-teal);
  border-color:var(--title-teal);
  color:#06231f; font-weight:600;
}
.count-row{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
.count-input{
  width:130px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px 12px;
  font-size:15px;
  background:var(--surface-raised);
  color:#e4e7ee;
}
.count-input::placeholder{color:var(--text-dimmer); font-size:13px;}
.count-input:focus{outline:2px solid var(--title-teal-deep); outline-offset:1px;}
.count-avail{font-size:12.5px; color:var(--text-dimmer);}

/* ---------- Toggle pair (difficulty) ---------- */
.toggle-pair{display:flex; gap:10px;}
.toggle-opt{
  flex:1;
  border:1px solid var(--line);
  background:var(--surface-alt);
  border-radius:var(--radius-card);
  padding:12px 10px;
  text-align:center;
  cursor:pointer;
  transition:transform .12s ease;
}
.toggle-opt:hover{transform:translateY(-1px);}
.toggle-opt strong{display:block; font-size:14px; color:#e4e7ee;}
.toggle-opt span{display:block; font-size:12px; color:var(--text-dim); margin-top:2px;}
.toggle-opt.active{
  border-color:var(--title-gold-deep);
  background:rgba(248,201,92,0.13);
  box-shadow:0 0 0 1px var(--title-gold-deep) inset;
}
.toggle-opt.danger{
  border-color:var(--accent-pink-deep);
  background:rgba(255,77,115,0.15);
  box-shadow:0 0 0 1px var(--accent-pink-deep) inset, 0 0 24px rgba(255,77,115,0.45);
}
.toggle-opt.danger strong, .toggle-opt.danger span{color:var(--accent-pink);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  border:none; border-radius:11px;
  padding:14px 18px;
  font-size:15.5px; font-weight:600;
  cursor:pointer;
  transition:transform .1s ease, filter .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--title-teal); color:#06231f;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; color:var(--text-body); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--line-strong);}
.btn-gold{background:var(--title-gold); color:#2a1c00;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.start-bar{padding:22px 22px 0;}

/* ---------- Quiz screen ---------- */
.quiz-top{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px 0; gap:10px;
}
.quiz-progress{font-size:13px; font-weight:600; color:var(--text-dim);}
.quiz-score{font-size:13px; font-weight:600; color:var(--title-teal);}
.progress-track{
  height:6px; background:var(--surface-alt); border-radius:999px;
  margin:8px 22px 0; overflow:hidden;
}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--title-teal), var(--title-gold)); transition:width .3s ease;}

.card{
  margin:18px 22px 0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow-card);
  padding:26px 20px;
  text-align:center;
  animation:cardIn .3s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes cardIn{
  from{opacity:0; transform:scale(0.96) translateY(6px);}
  to{opacity:1; transform:scale(1) translateY(0);}
}
.card-eyebrow{font-size:12.5px; font-weight:600; color:var(--title-teal); margin:0 0 10px;}
.big-flag{display:flex; justify-content:center; margin:6px 0 4px; animation:flagPop .45s cubic-bezier(.3,1.3,.4,1) both;}
.big-flag img{
  max-width:64vw; max-height:120px;
  width:auto; height:auto;
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 8px 22px rgba(0,0,0,0.5);
  background:rgba(0,0,0,0.2);
}
.flag-inline{
  width:24px; height:16px;
  object-fit:contain;
  border-radius:2px; vertical-align:middle; margin-right:5px;
  background:rgba(0,0,0,0.25);
}
@keyframes flagPop{
  from{opacity:0; transform:scale(0.7) rotate(-6deg);}
  to{opacity:1; transform:scale(1) rotate(0);}
}
.card-name{font-family:var(--font-display); font-weight:700; font-size:1.6rem; margin:4px 0 0; color:var(--title-gold);}
.card-question{font-size:15.5px; color:var(--text-dim); margin:10px 0 0;}

.answer-block{padding:16px 22px 0;}
.option-list{display:flex; flex-direction:column; gap:9px;}
.option-btn{
  border:1px solid var(--line);
  background:var(--surface-alt);
  border-radius:12px;
  padding:13px 14px;
  font-size:15px;
  text-align:left;
  cursor:pointer;
  color:var(--text-body);
  transition:transform .1s ease, border-color .12s ease, background .12s ease;
}
.option-btn:hover:not(:disabled){transform:translateX(2px); border-color:var(--line-strong);}
.option-btn.selected{border-color:var(--select-blue); box-shadow:0 0 0 1px var(--select-blue) inset; background:rgba(77,163,255,0.12); color:#eaf2ff; animation:selectPulse .35s ease;}
@keyframes selectPulse{0%{transform:scale(1);} 45%{transform:scale(1.025);} 100%{transform:scale(1);}}
.option-btn.correct{border-color:#5eead4; background:rgba(94,234,212,0.16); box-shadow:0 0 0 1px #5eead4 inset; color:#e4e7ee; animation:pulseOk .5s ease;}
.option-btn.wrong{border-color:var(--accent-pink); background:rgba(255,117,151,0.12); box-shadow:0 0 0 1px var(--accent-pink) inset; color:#e4e7ee; animation:shake .35s ease;}
.option-btn:disabled{cursor:default;}
@keyframes pulseOk{0%{transform:scale(1);} 40%{transform:scale(1.03);} 100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}}

.field-label{font-size:13px; font-weight:600; color:var(--text-dim); margin:14px 0 6px; display:block;}
.field-label:first-child{margin-top:0;}
.text-input{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px 14px;
  font-size:16px;
  background:var(--surface-raised);
  color:#e4e7ee;
  transition:border-color .12s ease;
}
.text-input::placeholder{color:var(--text-dimmer);}
.text-input:focus{outline:2px solid var(--title-teal-deep); outline-offset:1px;}
.text-input.correct{border-color:#5eead4; background:rgba(94,234,212,0.08);}
.text-input.wrong{border-color:var(--accent-pink); background:rgba(255,117,151,0.08); animation:shake .35s ease;}
.input-note{font-size:12px; color:var(--text-dimmer); margin:6px 0 0;}

.feedback-banner{
  margin:14px 22px 0;
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  font-weight:600;
  animation:cardIn .25s ease both;
}
.feedback-banner.ok{background:rgba(94,234,212,0.13); color:#5eead4;}
.feedback-banner.bad{background:rgba(255,117,151,0.11); color:var(--accent-pink);}
.feedback-banner .answer-line{font-weight:500; display:block; margin-top:3px; color:var(--text-dim);}
.confetti-row{display:inline-flex; gap:6px; margin-left:8px;}
.confetti-row span{display:inline-block; animation:confettiPop .6s ease both;}
.confetti-row span:nth-child(2){animation-delay:.08s;}
.confetti-row span:nth-child(3){animation-delay:.16s;}
@keyframes confettiPop{
  0%{opacity:0; transform:translateY(4px) scale(0.5) rotate(0deg);}
  60%{opacity:1; transform:translateY(-6px) scale(1.15) rotate(12deg);}
  100%{opacity:1; transform:translateY(0) scale(1) rotate(0deg);}
}

/* ---------- Facts card ---------- */
.facts-card{
  margin:14px 22px 0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px 10px;
  animation:cardIn .3s cubic-bezier(.2,.7,.3,1) both;
}
.facts-title{
  font-family:var(--font-display);
  font-weight:700; font-size:1rem;
  color:var(--title-gold);
  margin:0 0 8px;
}
.facts-title.city{color:var(--title-teal);}
.fact-row{
  display:flex; gap:12px; align-items:baseline;
  justify-content:space-between;
  font-size:13.5px;
  padding:6px 0;
  border-bottom:1px dashed var(--line);
}
.fact-row:last-child{border-bottom:none;}
.fact-row span{color:var(--text-dim); flex-shrink:0;}
.fact-row strong{color:#e4e7ee; font-weight:600; text-align:right;}

.action-bar{padding:18px 22px 0; display:flex; gap:10px;}

/* ---------- Results ---------- */
.result-hero{
  margin:20px 22px 0;
  background:linear-gradient(160deg, #171b26, #0d0f16);
  border:1px solid var(--line-strong);
  border-radius:18px;
  padding:26px 20px;
  text-align:center;
  animation:cardIn .35s cubic-bezier(.2,.7,.3,1) both;
}
.result-score{
  font-family:var(--font-display); font-weight:800; font-size:2.6rem; margin:0;
  background:linear-gradient(100deg, var(--title-teal), var(--title-gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.result-label{font-size:13.5px; color:var(--text-dim); margin:4px 0 0;}
.review-list{padding:18px 22px 0; display:flex; flex-direction:column; gap:8px;}
.review-item{
  display:flex; align-items:flex-start; gap:10px;
  border:1px solid var(--line);
  background:var(--surface-alt);
  border-radius:12px; padding:11px 12px;
  font-size:13.5px;
}
.review-item .mark{font-size:15px; flex-shrink:0;}
.review-item .txt strong{display:block; font-size:14px; color:#e4e7ee;}
.review-item .txt span{color:var(--text-dim); display:block; margin-top:1px;}
.result-actions{padding:18px 22px 0; display:flex; flex-direction:column; gap:10px;}

/* ---------- Daily play screen ---------- */
.daily-card{margin:18px 22px 0;}
.hint-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; justify-content:center;}
.hint-chip{
  font-size:12.5px; font-weight:600;
  background:rgba(248,201,92,0.15); color:var(--title-gold);
  border-radius:999px; padding:5px 11px;
  animation:cardIn .25s ease both;
}
.attempts-row{display:flex; gap:6px; justify-content:center; margin-top:10px;}
.attempt-dot{width:9px; height:9px; border-radius:50%; background:var(--surface-alt); border:1px solid var(--line);}
.attempt-dot.used-ok{background:#5eead4;}
.attempt-dot.used-bad{background:var(--accent-pink);}

footer{padding:30px 22px 0; text-align:center; font-size:12px; color:var(--text-dimmer);}

@media (min-width:560px){
  .toggle-pair, .action-bar, .result-actions{flex-direction:row;}
  .mode-grid{flex-direction:row;}
  .mode-card{flex-direction:column; text-align:center; align-items:center;}
}
@media (prefers-reduced-motion: reduce){
  .btn, .card, .stamp-card, .big-flag, .option-btn, .feedback-banner, .result-hero, .screen-enter, .confetti-row span, .facts-card{animation:none !important; transition:none !important;}
}

/* ---------- Hard-mode red theme ---------- */
body.hard-mode{
  --title-teal: var(--accent-pink);
  --title-teal-deep: var(--accent-pink-deep);
}
body.hard-mode .hero{
  background:radial-gradient(120% 140% at 100% 0%, #301019 0%, #170a0d 55%, #0a0b10 100%);
}
body.hard-mode .flag-bg-scrim{background:#1a0308; opacity:0.68;}
button:focus-visible{outline:2px solid var(--title-teal-deep); outline-offset:2px;}
</style>
</head>

const DATA = RAW.map(r=>{
  const f = FACTS[r[5]] || [0,"—","—","—","—","—","—","—","—"];
  return {es:r[0], en:r[1], capEs:r[2], capEn:r[3], continent:r[4], code:r[5], f:f};

/* =========================================================
   HELPERS
   ========================================================= */
function flagImgUrl(code){ return "https://flagcdn.com/"+code.toLowerCase()+".svg"; }
function flagImgTag(code, name, extraClass){
  return '<img class="flag-img'+(extraClass?" "+extraClass:"")+'" src="'+flagImgUrl(code)+'" alt="Bandera de '+name+'" loading="lazy">';
}
function normalize(s){
  return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[.,'’`´\-]/g," ").replace(/\s+/g," ").trim();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function daysSinceEpoch(){
  const d = new Date();
  const local = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor(local.getTime()/86400000);
}
function dailyCountry(){
  const idx = ((daysSinceEpoch() % DATA.length) + DATA.length) % DATA.length;
  return DATA[idx];
}
function escapeAttr(s){ return String(s).replace(/"/g,"&quot;"); }

/* =========================================================
   LOCALIZATION HELPERS
   ========================================================= */
function T(){ return STR[state.config.lang]; }
function isEN(){ return state.config.lang === "en"; }
function cName(c){ return isEN() ? c.en : c.es; }
function cCap(c){ return isEN() ? c.capEn : c.capEs; }
function continentName(code){ return CONTINENTS[code][isEN()?"en":"es"]; }
function fmtPop(n){
  const s = (n).toLocaleString(isEN()?"en-US":"es-ES");
  return isEN() ? s+" million" : s+" millones";
}
function popStr(c){ return fmtPop(c.f[0]); }
function curStr(c){ return isEN() ? c.f[2] : c.f[1]; }
function langStr(c){ return isEN() ? c.f[4] : c.f[3]; }
function hiStr(c){ return isEN() ? c.f[6] : c.f[5]; }
function capHiStr(c){ return isEN() ? c.f[8] : c.f[7]; }

function matchesCountry(input, c){
  const n = normalize(input);
  if(!n) return false;
  if(n === normalize(c.es) || n === normalize(c.en)) return true;
  const a = ALIASES[c.code];
  if(a && a.n && a.n.some(x=>normalize(x)===n)) return true;
  return false;
}
function matchesCapital(input, c){
  const n = normalize(input);
  if(!n) return false;
  if(n === normalize(c.capEs) || n === normalize(c.capEn)) return true;
  const a = ALIASES[c.code];
  if(a && a.c && a.c.some(x=>normalize(x)===n)) return true;
  return false;
}

/* =========================================================
   STORAGE
   ========================================================= */
async function loadDaily(){
  const key = "daily-progress:" + todayKey();
  let record = null, streak = {count:0,lastDate:null};
  try{
    const r = await window.storage.get(key, false);
    if(r && r.value) record = JSON.parse(r.value);
  }catch(e){ record = null; }
  try{
    const s = await window.storage.get("daily-streak", false);
    if(s && s.value) streak = JSON.parse(s.value);
  }catch(e){}
  state.daily.record = record;
  state.daily.streak = streak;
  state.daily.loading = false;
  render();
}
async function saveDailyRecord(record){
  const key = "daily-progress:" + todayKey();
  try{ await window.storage.set(key, JSON.stringify(record), false); }catch(e){}
}
async function saveStreak(streak){
  try{ await window.storage.set("daily-streak", JSON.stringify(streak), false); }catch(e){}
}

/* =========================================================
   POOL / QUIZ BUILDING
   ========================================================= */
function poolFor(scope){
  return scope === "global" ? DATA : DATA.filter(c => c.continent === scope);
}
function valOf(c, key){ return key === "name" ? cName(c) : cCap(c); }
function buildOptions(correctValue, key, pool, globalFallback){
  let source = pool.filter(c => valOf(c,key) !== correctValue);
  if(source.length < 3) source = globalFallback.filter(c => valOf(c,key) !== correctValue);
  const distractors = sample(source, 3).map(c => valOf(c,key));
  return shuffle([correctValue, ...distractors]);
}
function countFor(pool){
  const c = state.config.count;
  if(c === "all") return pool.length;
  return Math.min(c, pool.length);
}
function buildQuestions(){
  const { mode, scope, difficulty } = state.config;
  const pool = poolFor(scope);
  const n = countFor(pool);
  const chosen = sample(pool, n);
  return chosen.map(country => {
    const q = { country, mode, difficulty };
    if(difficulty === "easy"){
      if(mode === "flags" || mode === "both") q.countryOptions = buildOptions(cName(country), "name", pool, DATA);
      if(mode === "capitals" || mode === "both") q.capitalOptions = buildOptions(cCap(country), "capital", pool, DATA);
    }
    return q;
  });
}

/* =========================================================
   BACKGROUND
   ========================================================= */
function renderFlagBackground(){
  const pool = poolFor(state.config.scope);
  const el = document.getElementById("flag-bg");
  if(!el || !pool.length) return;

  // Máximo de banderas para que no queden diminutas, pero usando solo únicas.
  // Si el continente tiene menos, se usan todas.
  const MAX = 36;
  const items = shuffle(pool).slice(0, Math.min(pool.length, MAX));
  const n = items.length;

  // Tamaño "real" un poco más grande que la pantalla para que las rotaciones no dejen huecos.
  const w = window.innerWidth + 80;
  const h = window.innerHeight + 80;

  // Columnas/filas para que la rejilla encaje con la proporción de la pantalla.
  const cols = Math.max(1, Math.round(Math.sqrt(n * w / h)));
  const rows = Math.ceil(n / cols);

  el.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  el.style.gridTemplateRows    = 'repeat(' + rows + ', 1fr)';

  el.innerHTML = items.map(c => {
    const rot = (Math.random() * 30 - 15).toFixed(1);      // -15° a +15°
    const sc  = (0.9 + Math.random() * 0.25).toFixed(2);   // 90% a 115%
    return '<img src="' + flagImgUrl(c.code) + '" alt="" loading="lazy" ' +
           'style="transform:rotate(' + rot + 'deg) scale(' + sc + ');">';
  }).join("");
}

function render(){
  const app = document.getElementById("app");
  document.body.classList.toggle("hard-mode", state.config.difficulty === "hard");
  document.getElementById("ads-results").style.display = state.screen === "results" ? "block" : "none";
  document.getElementById("ads-feedback").style.display = (state.screen === "quiz" && state.quiz && state.quiz.feedback) || (state.screen === "daily" && state.daily.record && (state.daily.record.solved || state.daily.record.givenUp)) ? "block" : "none";
  document.documentElement.lang = state.config.lang;
  let inner = "";
  if(state.screen === "home") inner = renderHome();
  else if(state.screen === "quiz") inner = renderQuiz();
  else if(state.screen === "results") inner = renderResults();
  else if(state.screen === "daily") inner = renderDaily();
  app.innerHTML = '<div class="screen-enter">'+inner+'</div>';
  attachHandlers();
}

function currentQuestion(){ return state.quiz.questions[state.quiz.index]; }

function fieldClass(feedback, field){
  if(!feedback) return "";
  return feedback.fields && feedback.fields[field] ? (" " + feedback.fields[field]) : "";
}

function optionButtonHtml(opt, field){
  const sel = state.quiz.selection[field];
  const feedback = state.quiz.feedback;
  let cls = "option-btn";
  if(feedback){
    const q = currentQuestion();
    const correctVal = field === "country" ? cName(q.country) : cCap(q.country);
    if(opt === correctVal) cls += " correct";
    else if(opt === sel) cls += " wrong";
  } else if(opt === sel){
    cls += " selected";
  }
  return '<button class="'+cls+'" data-action="select-option" data-field="'+field+'" data-value="'+escapeAttr(opt)+'" '+(feedback?"disabled":"")+'>'+opt+'</button>';
}

function factsHtml(c, mode){
  const t = T();
  const showCity = mode === "capitals" || mode === "both";
  let html = "";
  if(showCity){
    html += '<div class="facts-card">'+
      '<p class="facts-title city">'+t.aboutCity+'</p>'+
      '<div class="fact-row"><span>'+t.country+'</span><strong>'+cName(c)+'</strong></div>'+
      '<div class="fact-row"><span>'+t.cityFact+'</span><strong>'+capHiStr(c)+'</strong></div>'+
    '</div>';
  }
  html += '<div class="facts-card">'+
    '<p class="facts-title">'+t.aboutCountry+'</p>'+
    '<div class="fact-row"><span>'+t.population+'</span><strong>'+popStr(c)+'</strong></div>'+
    '<div class="fact-row"><span>'+t.currency+'</span><strong>'+curStr(c)+'</strong></div>'+
    '<div class="fact-row"><span>'+t.language+'</span><strong>'+langStr(c)+'</strong></div>'+
    '<div class="fact-row"><span>'+t.fact+'</span><strong>'+hiStr(c)+'</strong></div>'+
  '</div>';
  return html;
}

function renderQuiz(){
  const t = T();
  const q = currentQuestion();
  const total = state.quiz.questions.length;
  const idx = state.quiz.index + 1;
  const pct = Math.round((state.quiz.index / total) * 100);
  const showFlag = q.mode === "flags" || q.mode === "both";
  const feedback = state.quiz.feedback;

  let promptHtml;
  if(showFlag){
    promptHtml = '<div class="big-flag">'+flagImgTag(q.country.code, cName(q.country))+'</div>'+
      '<p class="card-question">'+(q.mode === "both" ? t.bothQ : t.whatCountry)+'</p>';
  } else {
    promptHtml = '<p class="card-eyebrow">'+t.country+'</p>'+
      '<p class="card-name">'+cName(q.country)+'</p>'+
      '<p class="card-question">'+t.whatCapital+'</p>';
  }

  let answerHtml = "";
  const needCountry = q.mode === "flags" || q.mode === "both";
  const needCapital = q.mode === "capitals" || q.mode === "both";

  if(q.difficulty === "easy"){
    if(needCountry){
      answerHtml += '<span class="field-label">'+(q.mode==="both" ? t.country : "")+'</span><div class="option-list" data-field="country">';
      answerHtml += q.countryOptions.map(opt => optionButtonHtml(opt, "country")).join("");
      answerHtml += '</div>';
    }
    if(needCapital){
      answerHtml += '<span class="field-label">'+(q.mode==="both" ? t.capital : "")+'</span><div class="option-list" data-field="capital">';
      answerHtml += q.capitalOptions.map(opt => optionButtonHtml(opt, "capital")).join("");
      answerHtml += '</div>';
    }
  } else {
    if(needCountry){
      answerHtml += '<span class="field-label">'+t.country+'</span>'+
        '<input class="text-input'+fieldClass(feedback,"country")+'" id="input-country" type="text" placeholder="'+t.writeCountry+'" '+(feedback?"disabled":"")+' value="'+escapeAttr(state.quiz.draft.country||"")+'">';
    }
    if(needCapital){
      answerHtml += '<span class="field-label">'+t.capital+'</span>'+
        '<input class="text-input'+fieldClass(feedback,"capital")+'" id="input-capital" type="text" placeholder="'+t.writeCapital+'" '+(feedback?"disabled":"")+' value="'+escapeAttr(state.quiz.draft.capital||"")+'">';
    }
    if(!feedback) answerHtml += '<p class="input-note">'+t.note+'</p>';
  }

  let feedbackHtml = "";
  if(feedback){
    const cls = feedback.correct ? "ok" : "bad";
    const label = feedback.correct
      ? t.ok+' <span class="confetti-row"><span>🎉</span><span>✨</span><span>🎊</span></span>'
      : t.bad;
    let detail = "";
    if(!feedback.correct){
      const parts = [];
      if(needCountry) parts.push(t.country+": "+cName(q.country));
      if(needCapital) parts.push(t.capital+": "+cCap(q.country));
      detail = '<span class="answer-line">'+parts.join(" · ")+'</span>';
    }
    feedbackHtml = '<div class="feedback-banner '+cls+'">'+label+detail+'</div>';
  }

  const canSubmit = q.difficulty === "easy"
    ? (needCountry ? !!state.quiz.selection.country : true) && (needCapital ? !!state.quiz.selection.capital : true)
    : true;

  const actionHtml = !feedback
    ? '<div class="action-bar"><button class="btn btn-primary btn-block" data-action="submit-answer" '+(canSubmit?"":"disabled")+'>'+t.check+'</button></div>'
    : '<div class="action-bar"><button class="btn btn-primary btn-block" data-action="next-question">'+(idx < total ? t.next : t.seeResults)+'</button></div>';

  const facts = feedback ? factsHtml(q.country, q.mode) : "";

  return '<div class="quiz-top">'+
      '<span class="quiz-progress">'+t.q+' '+idx+' '+t.of+' '+total+'</span>'+
      '<span class="quiz-score">'+t.score+': '+state.quiz.score+'</span>'+
    '</div>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="card">'+promptHtml+'</div>'+
    '<div class="answer-block">'+answerHtml+'</div>'+
    feedbackHtml+
    facts+
    actionHtml+
    '<div class="start-bar"><button class="btn btn-ghost btn-block" data-action="abort-quiz">'+t.exit+'</button></div>';
}

/* =========================================================
   RESULTS
   ========================================================= */
function renderResults(){
  const t = T();
  const total = state.quiz.questions.length;
  const score = state.quiz.score;
  const pct = Math.round((score/total)*100);
  let msg;
  if(pct === 100) msg = t.perfect;
  else if(pct >= 70) msg = t.great;
  else if(pct >= 40) msg = t.onTrack;
  else msg = t.keep;

  const items = state.quiz.review.map(r =>
    '<div class="review-item">'+
      '<span class="mark">'+(r.correct ? "✅" : "❌")+'</span>'+
      '<div class="txt">'+
        '<strong>'+flagImgTag(r.country.code, cName(r.country), "flag-inline")+cName(r.country)+'</strong>'+
        '<span>'+t.capital+': '+cCap(r.country)+' · '+continentName(r.country.continent)+'</span>'+
      '</div>'+
    '</div>'
  ).join("");

  return langToggleHtml()+
  '<div class="result-hero">'+
    '<p class="result-score">'+score+'/'+total+'</p>'+
    '<p class="result-label">'+msg+'</p>'+
  '</div>'+
  '<div class="review-list">'+items+'</div>'+
  '<div class="result-actions">'+
    '<button class="btn btn-primary btn-block" data-action="retry-quiz">'+t.again+'</button>'+
    '<button class="btn btn-ghost btn-block" data-action="go-home">'+t.changeCfg+'</button>'+
  '</div>'+
  '<footer>'+t.footer+'</footer>';
}

/* =========================================================
   DAILY
   ========================================================= */
function renderDaily(){
  const t = T();
  const country = dailyCountry();
  const d = state.daily;
  const record = d.record || { attempts:0, guesses:[], solved:false, givenUp:false };
  const maxAttempts = 4;
  const done = record.solved || record.givenUp;

  const hints = [];
  if(record.attempts >= 1) hints.push(t.continent+": "+continentName(country.continent));
  if(record.attempts >= 2) hints.push(t.startsWith(cName(country)[0]));
  if(record.attempts >= 3) hints.push(t.capStartsWith(cCap(country)[0]));

  const dots = Array.from({length:maxAttempts}).map((_,i)=>{
    const g = record.guesses[i];
    let cls = "attempt-dot";
    if(g) cls += g.correct ? " used-ok" : " used-bad";
    return '<span class="'+cls+'"></span>';
  }).join("");

  let body;
  if(done){
    body = '<div class="big-flag">'+flagImgTag(country.code, cName(country))+'</div>'+
      '<p class="card-name">'+cName(country)+'</p>'+
      '<p class="card-question">'+t.capital+': '+cCap(country)+'</p>'+
      '<div class="feedback-banner '+(record.solved?"ok":"bad")+'" style="margin:16px 0 0;">'+
        (record.solved ? t.solvedTomorrow+' <span class="confetti-row"><span>🎉</span><span>✨</span><span>🎊</span></span>' : t.noMoreTries)+
      '</div>';
  } else {
    body = '<div class="big-flag">'+flagImgTag(country.code, cName(country))+'</div>'+
      '<p class="card-question">'+t.writeBoth+'</p>'+
      '<div class="attempts-row">'+dots+'</div>'+
      (hints.length ? '<div class="hint-row">'+hints.map(h=>'<span class="hint-chip">'+h+'</span>').join("")+'</div>' : "");
  }

  const form = done ? "" :
    '<div class="answer-block">'+
      '<span class="field-label">'+t.country+'</span>'+
      '<input class="text-input" id="daily-country" type="text" placeholder="'+t.writeCountry+'" value="'+escapeAttr(d.guessCountry||"")+'">'+
      '<span class="field-label">'+t.capital+'</span>'+
      '<input class="text-input" id="daily-capital" type="text" placeholder="'+t.writeCapital+'" value="'+escapeAttr(d.guessCapital||"")+'">'+
      '<p class="input-note">'+t.note+' '+t.attempts(maxAttempts - record.attempts)+'</p>'+
    '</div>'+
    '<div class="action-bar">'+
      '<button class="btn btn-primary btn-block" data-action="submit-daily">'+t.check+'</button>'+
    '</div>';

  const facts = done ? factsHtml(country, "both") : "";

  return langToggleHtml()+
  '<div class="quiz-top">'+
    '<span class="quiz-progress">'+t.dailyChallenge+'</span>'+
    '<span class="quiz-score">🔥 '+d.streak.count+'</span>'+
  '</div>'+
  '<div class="card">'+body+'</div>'+
  form+
  facts+
  '<div class="start-bar"><button class="btn btn-ghost btn-block" data-action="go-home">'+t.backHome+'</button></div>';
}

/* =========================================================
   ACTIONS
   ========================================================= */
function attachHandlers(){
  const app = document.getElementById("app");
  app.querySelectorAll("[data-action]").forEach(el => el.addEventListener("click", onAction));
  const custom = document.getElementById("custom-count");
  if(custom){
    custom.addEventListener("change", ()=>{
      const v = parseInt(custom.value, 10);
      const max = poolFor(state.config.scope).length;
      if(!isNaN(v) && v >= 1){
        state.config.count = Math.min(v, max);
        render();
      } else if(custom.value === ""){
        state.config.count = 10;
        render();
      }
    });
  }
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  const value = el.dataset.value;

  if(action === "set-mode"){ state.config.mode = value; render(); }
  else if(action === "set-scope"){ state.config.scope = value; render(); renderFlagBackground(); }
  else if(action === "set-difficulty"){ state.config.difficulty = value; render(); }
  else if(action === "set-count"){
    state.config.count = value === "all" ? "all" : parseInt(value, 10);
    render();
  }
  else if(action === "set-lang"){
    state.config.lang = value;
    render(); renderFlagBackground();
  }
  else if(action === "start-quiz"){ startQuiz(); }
  else if(action === "select-option"){ selectOption(el.dataset.field, value); }
  else if(action === "submit-answer"){ submitAnswer(); }
  else if(action === "next-question"){ nextQuestion(); }
  else if(action === "abort-quiz"){ state.screen = "home"; render(); }
  else if(action === "retry-quiz"){ startQuiz(); }
  else if(action === "go-home"){ state.screen = "home"; render(); }
  else if(action === "open-daily"){ state.screen = "daily"; render(); }
  else if(action === "submit-daily"){ submitDaily(); }
}

function startQuiz(){
  const questions = buildQuestions();
  state.quiz = { questions, index:0, score:0, review:[], feedback:null, selection:{country:null,capital:null}, draft:{country:"",capital:""} };
  state.screen = "quiz";
  render();
}

function selectOption(field, value){
  if(state.quiz.feedback) return;
  state.quiz.selection[field] = value;
  render();
}

function submitAnswer(){
  const q = currentQuestion();
  const needCountry = q.mode === "flags" || q.mode === "both";
  const needCapital = q.mode === "capitals" || q.mode === "both";
  let countryOk = true, capitalOk = true;
  const fields = {};

  if(q.difficulty === "easy"){
    if(needCountry) countryOk = state.quiz.selection.country === cName(q.country);
    if(needCapital) capitalOk = state.quiz.selection.capital === cCap(q.country);
  } else {
    if(needCountry){
      const el = document.getElementById("input-country");
      const val = el ? el.value : "";
      state.quiz.draft.country = val;
      countryOk = matchesCountry(val, q.country);
      fields.country = countryOk ? "correct" : "wrong";
    }
    if(needCapital){
      const el = document.getElementById("input-capital");
      const val = el ? el.value : "";
      state.quiz.draft.capital = val;
      capitalOk = matchesCapital(val, q.country);
      fields.capital = capitalOk ? "correct" : "wrong";
    }
  }

  const correct = countryOk && capitalOk;
  if(correct) state.quiz.score++;
  state.quiz.review.push({ country: q.country, correct });
  state.quiz.feedback = { correct, fields };
  render();
}

function nextQuestion(){
  const total = state.quiz.questions.length;
  if(state.quiz.index + 1 < total){
    state.quiz.index++;
    state.quiz.feedback = null;
    state.quiz.selection = {country:null, capital:null};
    state.quiz.draft = {country:"", capital:""};
    render();
  } else {
    state.screen = "results";
    render();
  }
}

async function submitDaily(){
  const country = dailyCountry();
  const record = state.daily.record || { attempts:0, guesses:[], solved:false, givenUp:false };
  const countryEl = document.getElementById("daily-country");
  const capitalEl = document.getElementById("daily-capital");
  const countryVal = countryEl ? countryEl.value : "";
  const capitalVal = capitalEl ? capitalEl.value : "";
  state.daily.guessCountry = countryVal;
  state.daily.guessCapital = capitalVal;

  const countryOk = matchesCountry(countryVal, country);
  const capitalOk = matchesCapital(capitalVal, country);
  const correct = countryOk && capitalOk;

  record.attempts++;
  record.guesses.push({ countryVal, capitalVal, correct });

  const maxAttempts = 4;
  if(correct) record.solved = true;
  else if(record.attempts >= maxAttempts) record.givenUp = true;

  state.daily.record = record;
  await saveDailyRecord(record);

  if(record.solved || record.givenUp){
    const streak = state.daily.streak || {count:0,lastDate:null};
    const today = todayKey();
    if(record.solved){
      const y = new Date(); y.setDate(y.getDate()-1);
      const yKey = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
      if(streak.lastDate === yKey) streak.count = streak.count + 1;
      else streak.count = 1;
      streak.lastDate = today;
    } else {
      streak.count = 0;
      streak.lastDate = today;
    }
    state.daily.streak = streak;
    await saveStreak(streak);
  }

  render();
}

/* =========================================================
   INIT
   ========================================================= */
render();
loadDaily();
renderFlagBackground();
</script>
